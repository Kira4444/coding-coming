# 本机开发配置（--spring.profiles.active=dev）
#
# 数据落在项目内的便携 MySQL（见 mysql/ 目录），密码、账号、会话都存这里，
# 不用系统级安装。启动前先起 MySQL：
#
#   mysql\mysql-8.4.9-winx64\bin\mysqld.exe --defaults-file=mysql\my.ini
#
# 生产配置见 application.yml，仍是 MySQL —— 只是连接参数从环境变量读。
#
# ⚠ 沙箱驱动是 local：agent 的命令以服务进程身份直接跑在你机器上，无任何隔离。
#   只在这个 profile 下用，不要带到服务器上去。

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/coding_agent?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: coding_agent
    password: coding_agent
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

coding-agent:
  sandbox:
    driver: local
  workspace-root: ./data/workspaces

logging:
  level:
    com.codingagent: DEBUG
